[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractmusic"
dynamic = ["version"]
description = "Model-agnostic local music/audio generation abstractions for the Abstract ecosystem"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Laurent-Philippe Albou", email = "contact@abstractcore.ai"}]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Keep base import-light. Local model runtimes live behind explicit extras.
dependencies = []

[project.urls]
Homepage = "https://github.com/lpalbou/AbstractMusic"
Repository = "https://github.com/lpalbou/AbstractMusic"

[project.scripts]
abstractmusic = "abstractmusic.cli:main"

[project.entry-points."abstractcore.capabilities_plugins"]
abstractmusic = "abstractmusic.integrations.abstractcore_plugin:register"

[project.optional-dependencies]
acestep = [
  "numpy>=1.24.0",
  "torch>=2.0,<3.0.0",
  "diffusers>=0.36.0",
  "transformers>=4.0,<6.0.0",
  "accelerate>=0.0",
  "safetensors>=0.0",
  "huggingface_hub>=0.20.0",
  "einops>=0.8.1",
]
