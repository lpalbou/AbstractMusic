name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without the leading v (example: 0.1.2)"
        required: true
        type: string
      publish:
        description: "Publish to PyPI, create a GitHub Release, and deploy docs"
        required: true
        type: boolean
        default: false
      publish_confirmation:
        description: "Required when publish=true: publish-abstractmusic-<version>"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"
      - name: Pytest
        run: python -m pytest -q -m "not integration"

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      tag: ${{ steps.release-meta.outputs.tag }}
      should_publish: ${{ steps.release-meta.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install -U pip
          python -m pip install build twine
      - name: Validate tag, version, and changelog
        id: release-meta
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          RELEASE_INPUT_PUBLISH: ${{ github.event.inputs.publish || '' }}
          RELEASE_INPUT_CONFIRMATION: ${{ github.event.inputs.publish_confirmation || '' }}
        run: |
          python - <<'PY'
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          version_input = os.environ.get("RELEASE_INPUT_VERSION", "").strip()
          publish_input = os.environ.get("RELEASE_INPUT_PUBLISH", "").strip().lower()
          confirmation = os.environ.get("RELEASE_INPUT_CONFIRMATION", "").strip()
          event_name = os.environ["GITHUB_EVENT_NAME"].strip()
          ref_name = os.environ["GITHUB_REF_NAME"].strip()
          raw_version = version_input or ref_name
          version = raw_version[1:] if raw_version.startswith("v") else raw_version
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[a-zA-Z0-9.-]+)?", version):
              raise SystemExit(f"Invalid release version: {raw_version!r}")
          tag = f"v{version}"

          version_text = Path("src/abstractmusic/_version.py").read_text(encoding="utf-8")
          version_match = re.search(r'__version__\s*=\s*"([^"]+)"', version_text)
          if not version_match:
              raise SystemExit("Could not find __version__ in src/abstractmusic/_version.py")
          package_version = version_match.group(1)
          if version != package_version:
              raise SystemExit(
                  f"Tag version {version!r} does not match package version {package_version!r}"
              )

          should_publish = event_name != "workflow_dispatch" or publish_input == "true"
          if event_name == "workflow_dispatch" and should_publish:
              expected = f"publish-abstractmusic-{version}"
              if confirmation != expected:
                  raise SystemExit(
                      "Manual publish requires publish_confirmation="
                      f"{expected!r}; got {confirmation!r}"
                  )
          if event_name != "workflow_dispatch" and ref_name != tag:
              raise SystemExit(f"Tag trigger ref {ref_name!r} does not match expected {tag!r}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = re.search(rf"^## \[{re.escape(version)}\] - .+$", changelog, re.MULTILINE)
          if not header:
              raise SystemExit(f"CHANGELOG.md has no entry for {version}")

          rest = changelog[header.end():]
          next_header = re.search(r"^## \[", rest, re.MULTILINE)
          notes = rest[: next_header.start() if next_header else len(rest)].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md entry for {version} is empty")

          if should_publish:
              url = f"https://pypi.org/pypi/abstractmusic/{version}/json"
              try:
                  with urllib.request.urlopen(url, timeout=10):
                      raise SystemExit(f"PyPI already has abstractmusic {version}; refusing duplicate publish")
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise

          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              print(f"version={version}", file=fh)
              print(f"tag={tag}", file=fh)
              print(f"should_publish={str(should_publish).lower()}", file=fh)
          PY
      - name: Build
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs tools
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs]"
      - name: Build docs
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site

  ensure-tag:
    name: Ensure release tag
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create annotated tag for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ needs.build.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "AbstractMusic ${tag}"
          git push origin "${tag}"
      - name: Tag already supplied by push trigger
        if: github.event_name != 'workflow_dispatch'
        run: echo "Using existing tag ${{ needs.build.outputs.tag }}"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, ensure-tag]
    if: needs.build.outputs.should_publish == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/abstractmusic/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, ensure-tag, publish-pypi]
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: AbstractMusic ${{ needs.build.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

  deploy-docs:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, docs, ensure-tag, publish-pypi, github-release]
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
